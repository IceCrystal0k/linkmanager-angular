<form [formGroup]="form">
  <mat-radio-group formControlName="action">
    <mat-radio-button value="delete" class="mr-4"><label
        class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500">Delete all subcategories and
        links</label></mat-radio-button>
    <mat-radio-button value="move">
      <label class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500">Move subcategories and links to
        category</label>
      <mat-form-field class="w-full">
        <mat-select formControlName="category_id" placeholder="Select a category">
          @for (category of categories(); track category.id) {
          <mat-option [value]="category.id">{{ category.nameIndented || category.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-radio-button>
  </mat-radio-group>
</form>
