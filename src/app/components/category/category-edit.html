<!-- Login Reactive Form Canvas -->
<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
    <input
        type="email"
        formControlName="email"
        placeholder="name@company.com"
        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-slate-700 transition-all"
    />
    @if (categoryForm.get('email')?.touched && categoryForm.get('email')?.invalid) {
        <p class="text-xs text-rose-500 font-medium mt-1">Please enter a valid email address.</p>
    }
    </div>

    <div>
    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
    <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-slate-700 transition-all"
    />
    @if (categoryForm.get('password')?.touched && categoryForm.get('password')?.invalid) {
        <p class="text-xs text-rose-500 font-medium mt-1">Password must be at least 6 characters.</p>
    }
    </div>

    <!-- Display API Error Alert if signal has value -->
    @if (errorMessage()) {
    <div class="p-3 mb-4 text-sm text-rose-600 bg-rose-50 rounded-xl border border-rose-100 font-medium">
        {{ errorMessage() }}
    </div>
    }

    <button
    mat-flat-button
    color="primary"
    type="submit"
    [disabled]="categoryForm.invalid"
    class="w-full !py-6 !rounded-xl !bg-blue-600 hover:!bg-blue-700 transition-all shadow-lg disabled:!opacity-50 disabled:!cursor-not-allowed">
    Sign In to Portal
    </button>
</form>
