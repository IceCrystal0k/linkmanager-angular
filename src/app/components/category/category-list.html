@if (isSidebarExpanded()) {
  <div class="mt-2 pl-4">
    <mat-tree #categoryTree [dataSource]="categoryListData()" [childrenAccessor]="childrenAccessor">

      <!-- Leaf Nodes -->
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding matTreeNodePaddingIndent="10" [class.!bg-blue-50]="node.isSelected" class="hover:!bg-teal-50">
        <button
          matIconButton
          [disableRipple]="true"
          (click)="onCategorySelect(node, categoryTree, $event)"
          class="w-full !justify-start !text-left !px-2 !py-1 text-slate-600 hover:!bg-transparent bg-transparent !text-xs !font-medium flex items-center group">
          <mat-icon class="scale-75 text-slate-400 group-hover:text-blue-500 transition-colors">label</mat-icon>
          <span class="truncate">{{ node.name }}</span>
          @if (node.isSelected) {
            <mat-icon class="scale-75 text-blue-500 ml-auto">check</mat-icon>
          }
        </button>
      </mat-tree-node>

      <!-- Expandable Nodes -->
      <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding matTreeNodePaddingIndent="10" [class.!bg-blue-50]="node.isSelected" class="hover:!bg-teal-50">
        <div class="flex flex-col flex-1">
          <button
            (click)="onCategorySelect(node, categoryTree, $event)"
            matIconButton
            [disableRipple]="true"
            class="w-full !justify-start !text-left !px-2 !py-1 text-slate-700 hover:!bg-transparent bg-transparent !text-xs !font-semibold flex items-center group">
            <mat-icon class="scale-75 text-slate-400 hover:!text-black">{{categoryTree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}</mat-icon>
            <mat-icon class="scale-75 text-slate-400 group-hover:text-blue-500 transition-colors">folder</mat-icon>
            <span class="truncate">{{ node.name }}</span>
          </button>
        </div>
      </mat-tree-node>

    </mat-tree>
  </div>
}
@else {
  <div class="pl-5">...</div>
}
