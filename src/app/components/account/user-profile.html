<form [formGroup]="profileForm" class="space-y-5">
    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Email</label>
      <p>{{ email() }}</p>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">First Name</label>
      <input type="text" formControlName="first_name" placeholder="First name"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-slate-700 transition-all" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Last Name</label>
      <input type="text" formControlName="last_name" placeholder="Last name"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-slate-700 transition-all" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Avatar</label>
      @if (avatar()) {
        <div class="flex items-center gap-2">
          <img [src]="avatar()" alt="User Avatar" class="w-16 h-16 rounded-full">
          <button mat-icon-button type="button" aria-label="Edit avatar" (click)="editAvatar()" matTooltip="Edit avatar"
            [matTooltipPosition]="tooltipPosition">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" aria-label="Delete avatar" (click)="deleteAvatar()" matTooltip="Delete avatar"
            [matTooltipPosition]="tooltipPosition">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
      @if (!avatar() || isAvatarEditing()) {
        <app-image-upload (imageSelected)="onAvatarSelected($event)" />
      }
    </div>
</form>
