<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  {{data.content}}
</mat-dialog-content>
<mat-dialog-actions>
  @if(data.showCancelButton) {
  <button matButton (click)="onCancel()">{{data.cancelButtonText}}</button>
  }
  <button matButton cdkFocusInitial (click)="onConfirm()">{{data.confirmButtonText}}</button>
</mat-dialog-actions>
