<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <ng-container #content />
  @if (saveErrorMessage()) {
    <p class="mt-3 rounded-xl border border-rose-100 bg-rose-50 p-3 text-sm font-medium text-rose-600" role="alert">
      @for (error of saveErrorMessage(); track error) {
        {{ error }} <br/>
      }
    </p>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton class="edit-dialog-button !text-gray-700 hover:!text-gray-900" (click)="onCancel()">{{data.cancelButtonText}}</button>
  <button matButton cdkFocusInitial class="edit-dialog-button" [disabled]="!isFormValid" (click)="onSave()">{{data.saveButtonText}}</button>
</mat-dialog-actions>
