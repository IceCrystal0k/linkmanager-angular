<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <app-highlighted-text [text]="data.content" />
</mat-dialog-content>
<mat-dialog-actions>
  @if(!data.hideCancelButton) {
  <button matButton class="confirm-dialog-button !text-gray-700 hover:!text-gray-900" (click)="onCancel()">{{data.cancelButtonText}}</button>
  }
  <button matButton cdkFocusInitial class="confirm-dialog-button" (click)="onConfirm()">{{data.confirmButtonText}}</button>
</mat-dialog-actions>
