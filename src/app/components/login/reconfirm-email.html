<main class="flex min-h-screen w-full items-center justify-center bg-slate-900 px-4 py-8">
  <section class="w-full max-w-md rounded-2xl border border-slate-100 bg-white p-8 text-center shadow-2xl">
    <h1 class="text-2xl font-bold text-slate-800">Confirm your email</h1>
    <p class="mt-3 text-sm text-slate-600">
      You can request a confirmation email only once every 5 minutes.
    </p>

    <button mat-flat-button button-custom type="button" [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
      (click)="sendVerificationEmail()"
      class="mt-6 w-full !rounded-xl !bg-blue-600 !py-6 transition-all hover:!bg-blue-700 disabled:!cursor-not-allowed disabled:!opacity-50">
      Send confirmation email
    </button>

    @if (successMessage()) {
      <p class="mt-4 text-sm text-emerald-700" role="status">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="mt-4 text-sm text-rose-600" role="alert">{{ errorMessage() }}</p>
    }
  </section>
</main>
